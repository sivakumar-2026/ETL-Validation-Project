# Self-hosted Mac runner required (localhost DBs).
#
# Triggers (all send the same ETL QA Validation Report email + PDF):
#   - push / PR          → Run type: CI Push
#   - workflow_dispatch  → Run type: Manual
#   - schedule 08:00 IST → Run type: Daily RUN
#   - schedule every 15m → Run type: Automatic Validation (only if DB fingerprint changed)
name: ETL QA Validation

on:
  push:
    branches: [main, etl-db-migration-project]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 08:00 IST = 02:30 UTC
    - cron: "30 2 * * *"
    # Every 15 minutes (UTC) for source/target change detection
    - cron: "*/15 * * * *"

concurrency:
  group: etl-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-alert:
    name: Validate Album ETL + email report
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    env:
      RUN_TYPE: CI Push
      MSSQL_HOST: ${{ secrets.MSSQL_HOST || 'localhost' }}
      MSSQL_PORT: ${{ secrets.MSSQL_PORT || '1433' }}
      MSSQL_DATABASE: ${{ secrets.MSSQL_DATABASE || 'Sourcedb' }}
      MSSQL_USER: ${{ secrets.MSSQL_USER }}
      MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
      MSSQL_DRIVER: ${{ secrets.MSSQL_DRIVER || 'ODBC Driver 18 for SQL Server' }}
      MSSQL_TRUST_SERVER_CERTIFICATE: "yes"
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || 'localhost' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
      POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE || 'Targetdb' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SRC_TABLE: ${{ secrets.SRC_TABLE || 'dbo.Album' }}
      TGT_TABLE: ${{ secrets.TGT_TABLE || 'public.album' }}
      PRIMARY_KEY: ${{ secrets.PRIMARY_KEY || 'ALBUMID' }}
      MSSQL_JDBC_JAR: ${{ secrets.MSSQL_JDBC_JAR }}
      POSTGRES_JDBC_JAR: ${{ secrets.POSTGRES_JDBC_JAR }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'sivakumartorur@gmail.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Python (prefer known-good arm64 venv)
        id: py
        run: |
          set -euo pipefail
          echo "uname=$(uname -m)"
          # Prefer the Mac venv that already works for manual runs
          if [ -x "$HOME/venv/bin/python" ]; then
            mach="$("$HOME/venv/bin/python" -c 'import platform; print(platform.machine())')"
            if [ "$mach" = "arm64" ]; then
              echo "Using HOME/venv (arm64)"
              echo "python=$HOME/venv/bin/python" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          BASE_PY="/Library/Frameworks/Python.framework/Versions/3.13/bin/python3"
          [ -x "$BASE_PY" ] || BASE_PY="$(command -v python3)"
          echo "Recreating clean arm64 .venv from $BASE_PY"
          rm -rf .venv
          arch -arm64 "$BASE_PY" -m venv .venv
          echo "python=${GITHUB_WORKSPACE}/.venv/bin/python" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          set -euo pipefail
          PY="${{ steps.py.outputs.python }}"
          echo "PY=$PY"
          arch -arm64 "$PY" -c 'import platform,sys; print(sys.executable, platform.machine())'
          export PIP_PREFER_BINARY=1
          arch -arm64 "$PY" -m pip install -U pip setuptools wheel
          arch -arm64 "$PY" -m pip install -r requirements.txt
          arch -arm64 "$PY" -c "import numpy, pandas, pytest, dotenv; print('imports ok', numpy.__version__)"
          # Sanity: numpy must be arm64 on Apple Silicon
          arch -arm64 "$PY" - <<'PY'
          import numpy, pathlib
          so = pathlib.Path(numpy.__file__).parent / "_core" / "_multiarray_umath.cpython-313-darwin.so"
          # file may vary by version; just import is enough if arch -arm64 works
          print("numpy import under arm64 OK")
          PY

      - name: Set run type from event
        run: |
          EVENT="${{ github.event_name }}"
          # Daily 08:00 IST ≈ cron 30 2 * * * (UTC). GitHub can drift a few minutes.
          # 10# strips leading zeros so 0230 is not treated as octal.
          UTC_HM=$((10#$(date -u +%H%M)))
          if [ "$EVENT" = "schedule" ] && [ "$UTC_HM" -ge 225 ] && [ "$UTC_HM" -le 244 ]; then
            echo "RUN_TYPE=Daily RUN" >> "$GITHUB_ENV"
          elif [ "$EVENT" = "schedule" ]; then
            echo "RUN_TYPE=Automatic Validation" >> "$GITHUB_ENV"
            echo "POLL_ONLY=1" >> "$GITHUB_ENV"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "RUN_TYPE=Manual" >> "$GITHUB_ENV"
          else
            echo "RUN_TYPE=CI Push" >> "$GITHUB_ENV"
          fi
          echo "event=$EVENT utc_hm=$UTC_HM"

      - name: Write .env (prefer local Mac file when secrets blank)
        run: |
          set -euo pipefail
          umask 077
          LOCAL_ENV=""
          for candidate in "$HOME/.etl_validation.env" "$HOME/ETL_Python/.env"; do
            if [ -f "$candidate" ]; then LOCAL_ENV="$candidate"; break; fi
          done

          # Prefer full local .env whenever DB or SMTP secrets are missing
          if { [ -z "${SMTP_USER:-}" ] || [ -z "${MSSQL_USER:-}" ] || [ -z "${POSTGRES_USER:-}" ]; } && [ -n "$LOCAL_ENV" ]; then
            echo "Using local env file: $LOCAL_ENV"
            cp "$LOCAL_ENV" .env
          else
            {
              echo "MSSQL_HOST=${MSSQL_HOST}"
              echo "MSSQL_PORT=${MSSQL_PORT}"
              echo "MSSQL_DATABASE=${MSSQL_DATABASE}"
              echo "MSSQL_USER=${MSSQL_USER}"
              echo "MSSQL_PASSWORD=${MSSQL_PASSWORD}"
              echo "MSSQL_DRIVER=${MSSQL_DRIVER}"
              echo "MSSQL_TRUST_SERVER_CERTIFICATE=yes"
              echo "POSTGRES_HOST=${POSTGRES_HOST}"
              echo "POSTGRES_PORT=${POSTGRES_PORT}"
              echo "POSTGRES_DATABASE=${POSTGRES_DATABASE}"
              echo "POSTGRES_USER=${POSTGRES_USER}"
              echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
              echo "SRC_TABLE=${SRC_TABLE}"
              echo "TGT_TABLE=${TGT_TABLE}"
              echo "PRIMARY_KEY=${PRIMARY_KEY}"
              echo "MSSQL_JDBC_JAR=${MSSQL_JDBC_JAR}"
              echo "POSTGRES_JDBC_JAR=${POSTGRES_JDBC_JAR}"
              echo "SMTP_HOST=${SMTP_HOST}"
              echo "SMTP_PORT=${SMTP_PORT}"
              echo "SMTP_USER=${SMTP_USER}"
              echo "SMTP_PASSWORD=${SMTP_PASSWORD}"
              echo "SMTP_FROM=${SMTP_FROM:-$SMTP_USER}"
              echo "ALERT_EMAIL=${ALERT_EMAIL}"
            } > .env
          fi
          echo "MSSQL_USER set? $([ -n "$(grep '^MSSQL_USER=' .env | cut -d= -f2-)" ] && echo yes || echo NO)"
          echo "SMTP_USER set? $([ -n "$(grep '^SMTP_USER=' .env | cut -d= -f2-)" ] && echo yes || echo NO)"

      # ALWAYS run this step (never skip) so later steps are not cancelled by GHA
      - name: Decide whether to run full validation
        id: gate
        run: |
          set +e
          # Non-poll runs always proceed
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${RUN_TYPE}" = "Daily RUN" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Full validation required (event=${{ github.event_name }}, run_type=$RUN_TYPE)"
            exit 0
          fi
          # 15-min poll: only when fingerprint changed
          PY="${{ steps.py.outputs.python }}"
          arch -arm64 "$PY" jenkins/poll_gate.py
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No DB change — skip"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "DB change detected — run full validation"
          fi
          exit 0

      - name: Run validation suite
        id: validate
        if: steps.gate.outputs.skip != 'true'
        run: |
          set +e
          PY="${{ steps.py.outputs.python }}"
          arch -arm64 "$PY" jenkins/ci_validate.py
          code=$?
          mkdir -p reports
          echo "$code" > reports/exit_code.txt
          ls -la reports
          test -f reports/validation_summary.json && echo "SUMMARY_OK" || echo "SUMMARY_MISSING"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build email + PDF report
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          PY="${{ steps.py.outputs.python }}"
          arch -arm64 "$PY" jenkins/build_email.py || true
          arch -arm64 "$PY" jenkins/build_pdf.py || true
          ls -la reports
          echo "----- email body preview -----"
          head -40 reports/email_body.txt || true

      - name: Send data validation report email
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          PY="${{ steps.py.outputs.python }}"
          arch -arm64 "$PY" jenkins/send_email.py

      - name: Upload report artifacts
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: etl-validation-reports
          path: |
            reports/validation_dashboard.html
            reports/validation_report.pdf
            reports/validation_summary.json
            reports/email_body.txt
            reports/email_subject.txt
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          code=$(cat reports/exit_code.txt 2>/dev/null || echo 1)
          if [ "$code" != "0" ]; then
            echo "Validation failed with exit code $code"
            exit 1
          fi
