# Self-hosted Mac runner required (localhost DBs).
name: ETL QA Validation

on:
  push:
    branches: [main, etl-db-migration-project]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: etl-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-alert:
    name: Validate Album ETL + email report
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    env:
      RUN_TYPE: CI Push
      MSSQL_HOST: ${{ secrets.MSSQL_HOST || 'localhost' }}
      MSSQL_PORT: ${{ secrets.MSSQL_PORT || '1433' }}
      MSSQL_DATABASE: ${{ secrets.MSSQL_DATABASE || 'Sourcedb' }}
      MSSQL_USER: ${{ secrets.MSSQL_USER }}
      MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
      MSSQL_DRIVER: ${{ secrets.MSSQL_DRIVER || 'ODBC Driver 18 for SQL Server' }}
      MSSQL_TRUST_SERVER_CERTIFICATE: "yes"
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || 'localhost' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
      POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE || 'Targetdb' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SRC_TABLE: ${{ secrets.SRC_TABLE || 'dbo.Album' }}
      TGT_TABLE: ${{ secrets.TGT_TABLE || 'public.album' }}
      PRIMARY_KEY: ${{ secrets.PRIMARY_KEY || 'ALBUMID' }}
      MSSQL_JDBC_JAR: ${{ secrets.MSSQL_JDBC_JAR }}
      POSTGRES_JDBC_JAR: ${{ secrets.POSTGRES_JDBC_JAR }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'sivakumartorur@gmail.com' }}
      # Always use workspace venv python (avoids GITHUB_PATH / arch mixups)
      VENV_PY: ${{ github.workspace }}/.venv/bin/python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create arm64 virtualenv
        run: |
          set -euo pipefail
          echo "uname=$(uname -m) arch=$(arch)"
          # Prefer Apple Silicon native Python (avoid Rosetta x86_64 + arm64 CLT mismatch)
          CANDIDATES=(
            /Library/Frameworks/Python.framework/Versions/3.13/bin/python3
            /Library/Frameworks/Python.framework/Versions/3.12/bin/python3
            /opt/homebrew/bin/python3
            "$(command -v python3)"
          )
          BASE_PY=""
          for c in "${CANDIDATES[@]}"; do
            if [ -x "$c" ]; then
              mach="$("$c" -c 'import platform; print(platform.machine())' 2>/dev/null || true)"
              echo "candidate $c -> $mach"
              if [ "$mach" = "arm64" ]; then
                BASE_PY="$c"
                break
              fi
              # keep first working as fallback
              if [ -z "$BASE_PY" ]; then
                BASE_PY="$c"
              fi
            fi
          done
          echo "BASE_PY=$BASE_PY"
          rm -rf .venv
          if [ "$(uname -m)" = "arm64" ]; then
            arch -arm64 "$BASE_PY" -m venv .venv
          else
            "$BASE_PY" -m venv .venv
          fi
          "$VENV_PY" -c 'import platform,sys; print(sys.executable, platform.machine(), sys.version)'
          "$VENV_PY" -m pip install -U pip setuptools wheel

      - name: Install dependencies
        run: |
          set -euo pipefail
          export PIP_PREFER_BINARY=1
          export PIP_ONLY_BINARY="cryptography,cffi,numpy,pandas"
          "$VENV_PY" -m pip install -r requirements.txt
          "$VENV_PY" -c "import dotenv, numpy, pandas, pytest; print('imports ok')"

      - name: Write .env from secrets (fallback to local Mac file)
        run: |
          set -euo pipefail
          umask 077

          # If GitHub SMTP secrets are blank, use local Mac env (self-hosted only)
          LOCAL_ENV=""
          for candidate in "$HOME/.etl_validation.env" "$HOME/ETL_Python/.env"; do
            if [ -f "$candidate" ]; then
              LOCAL_ENV="$candidate"
              break
            fi
          done

          if [ -z "${SMTP_USER:-}" ] && [ -n "$LOCAL_ENV" ]; then
            echo "SMTP secrets empty — copying $LOCAL_ENV -> .env"
            cp "$LOCAL_ENV" .env
          else
            {
              echo "MSSQL_HOST=${MSSQL_HOST}"
              echo "MSSQL_PORT=${MSSQL_PORT}"
              echo "MSSQL_DATABASE=${MSSQL_DATABASE}"
              echo "MSSQL_USER=${MSSQL_USER}"
              echo "MSSQL_PASSWORD=${MSSQL_PASSWORD}"
              echo "MSSQL_DRIVER=${MSSQL_DRIVER}"
              echo "MSSQL_TRUST_SERVER_CERTIFICATE=yes"
              echo "POSTGRES_HOST=${POSTGRES_HOST}"
              echo "POSTGRES_PORT=${POSTGRES_PORT}"
              echo "POSTGRES_DATABASE=${POSTGRES_DATABASE}"
              echo "POSTGRES_USER=${POSTGRES_USER}"
              echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
              echo "SRC_TABLE=${SRC_TABLE}"
              echo "TGT_TABLE=${TGT_TABLE}"
              echo "PRIMARY_KEY=${PRIMARY_KEY}"
              echo "MSSQL_JDBC_JAR=${MSSQL_JDBC_JAR}"
              echo "POSTGRES_JDBC_JAR=${POSTGRES_JDBC_JAR}"
              echo "SMTP_HOST=${SMTP_HOST}"
              echo "SMTP_PORT=${SMTP_PORT}"
              echo "SMTP_USER=${SMTP_USER}"
              echo "SMTP_PASSWORD=${SMTP_PASSWORD}"
              echo "SMTP_FROM=${SMTP_FROM:-$SMTP_USER}"
              echo "ALERT_EMAIL=${ALERT_EMAIL}"
            } > .env
          fi

          echo "SMTP_USER set? $([ -n "$(grep '^SMTP_USER=' .env | cut -d= -f2-)" ] && echo yes || echo NO)"
          echo "SMTP_PASSWORD set? $([ -n "$(grep '^SMTP_PASSWORD=' .env | cut -d= -f2-)" ] && echo yes || echo NO)"

      - name: Run validation suite
        id: validate
        run: |
          set +e
          "$VENV_PY" jenkins/ci_validate.py
          code=$?
          mkdir -p reports
          echo "$code" > reports/exit_code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build email + PDF
        if: always()
        run: |
          export RUN_TYPE="CI Push"
          "$VENV_PY" jenkins/build_email.py || true
          "$VENV_PY" jenkins/build_pdf.py || true

      - name: Send email report
        if: always()
        run: |
          "$VENV_PY" jenkins/send_email.py

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-validation-reports
          path: |
            reports/validation_dashboard.html
            reports/validation_report.pdf
            reports/validation_summary.json
            reports/email_body.txt
            reports/email_subject.txt
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: always()
        run: |
          code=$(cat reports/exit_code.txt 2>/dev/null || echo 1)
          if [ "$code" != "0" ]; then
            echo "Validation failed with exit code $code"
            exit 1
          fi
