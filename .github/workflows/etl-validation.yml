# Runs when developers push / open PRs.
# IMPORTANT: uses a self-hosted runner on your Mac so tests can reach
# localhost MSSQL + Postgres. GitHub-hosted runners cannot see your laptop DBs.
#
# One-time setup:
#   1) GitHub repo → Settings → Actions → Runners → New self-hosted runner
#   2) Install + start the runner on the Mac where Docker DBs run
#   3) Repo → Settings → Secrets and variables → Actions → add secrets below

name: ETL QA Validation

on:
  push:
    branches: [main, etl-db-migration-project]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: etl-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-alert:
    name: Validate Album ETL + email report
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    env:
      RUN_TYPE: CI Push
      # DB
      MSSQL_HOST: ${{ secrets.MSSQL_HOST }}
      MSSQL_PORT: ${{ secrets.MSSQL_PORT }}
      MSSQL_DATABASE: ${{ secrets.MSSQL_DATABASE }}
      MSSQL_USER: ${{ secrets.MSSQL_USER }}
      MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
      MSSQL_DRIVER: ${{ secrets.MSSQL_DRIVER }}
      MSSQL_TRUST_SERVER_CERTIFICATE: "yes"
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SRC_TABLE: ${{ secrets.SRC_TABLE }}
      TGT_TABLE: ${{ secrets.TGT_TABLE }}
      PRIMARY_KEY: ${{ secrets.PRIMARY_KEY }}
      MSSQL_JDBC_JAR: ${{ secrets.MSSQL_JDBC_JAR }}
      POSTGRES_JDBC_JAR: ${{ secrets.POSTGRES_JDBC_JAR }}
      # Email
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner Python
        run: |
          which python3
          python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Write .env from secrets (for python-dotenv)
        run: |
          umask 077
          {
            echo "MSSQL_HOST=${MSSQL_HOST}"
            echo "MSSQL_PORT=${MSSQL_PORT}"
            echo "MSSQL_DATABASE=${MSSQL_DATABASE}"
            echo "MSSQL_USER=${MSSQL_USER}"
            echo "MSSQL_PASSWORD=${MSSQL_PASSWORD}"
            echo "MSSQL_DRIVER=${MSSQL_DRIVER:-ODBC Driver 18 for SQL Server}"
            echo "MSSQL_TRUST_SERVER_CERTIFICATE=yes"
            echo "POSTGRES_HOST=${POSTGRES_HOST}"
            echo "POSTGRES_PORT=${POSTGRES_PORT}"
            echo "POSTGRES_DATABASE=${POSTGRES_DATABASE}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "SRC_TABLE=${SRC_TABLE:-dbo.Album}"
            echo "TGT_TABLE=${TGT_TABLE:-public.album}"
            echo "PRIMARY_KEY=${PRIMARY_KEY:-ALBUMID}"
            echo "MSSQL_JDBC_JAR=${MSSQL_JDBC_JAR}"
            echo "POSTGRES_JDBC_JAR=${POSTGRES_JDBC_JAR}"
            echo "SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}"
            echo "SMTP_PORT=${SMTP_PORT:-587}"
            echo "SMTP_USER=${SMTP_USER}"
            echo "SMTP_PASSWORD=${SMTP_PASSWORD}"
            echo "SMTP_FROM=${SMTP_FROM}"
            echo "ALERT_EMAIL=${ALERT_EMAIL:-sivakumartorur@gmail.com}"
          } > .env

      - name: Run validation suite
        id: validate
        run: |
          set +e
          python3 jenkins/ci_validate.py
          code=$?
          echo $code > reports/exit_code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build email + PDF
        run: |
          export RUN_TYPE="CI Push"
          python3 jenkins/build_email.py || true
          python3 jenkins/build_pdf.py

      - name: Send email report
        if: always()
        run: python3 jenkins/send_email.py

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-validation-reports
          path: |
            reports/validation_dashboard.html
            reports/validation_report.pdf
            reports/validation_summary.json
            reports/email_body.txt
            reports/email_subject.txt
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: always()
        run: |
          code=$(cat reports/exit_code.txt 2>/dev/null || echo 1)
          if [ "$code" != "0" ]; then
            echo "Validation failed with exit code $code"
            exit 1
          fi
